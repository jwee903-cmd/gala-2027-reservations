<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic New Year 2027 Gala Dinner – Table Reservations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{--navy:#0f1733;--navy2:#18224a;--gold:#d9b25f;--gold2:#f3d58e;--cream:#fbf6ea;--ink:#1d2340;--muted:#6b7090;--red:#d6334a;--green:#2f9e5b;--amber:#e3a21a;--line:#e6dfcc}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1128;color:var(--ink)}
header{background:linear-gradient(90deg,#0b1128,#18224a);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:1px solid #2a3566}
header h1{font-family:'Cormorant Garamond',serif;font-size:26px;margin:0;color:var(--gold2);font-weight:700;letter-spacing:.3px}
header .sub{font-size:12px;color:#aab1d6}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav a{color:#cdd3f0;text-decoration:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid transparent}
nav a.on{background:var(--gold);color:var(--navy)}
nav a:hover:not(.on){border-color:#3a4680}
.kpis{display:flex;gap:10px;padding:12px 22px;background:#121a3a;flex-wrap:wrap}
.kpi{background:#1b2550;border:1px solid #2c3870;border-radius:10px;padding:8px 14px;color:#fff;min-width:118px}
.kpi b{display:block;font-size:22px;font-family:'Cormorant Garamond',serif}
.kpi span{font-size:11px;color:#aab1d6;text-transform:uppercase;letter-spacing:.6px}
.kpi.r b{color:#ff8b9b}.kpi.a b{color:#7fe0a6}.kpi.g b{color:var(--gold2)}
main{padding:18px 22px 40px}
.view{display:none}.view.on{display:block}
.save{font-size:12px;color:#aab1d6;margin-left:8px}
/* floor plan */
.mapwrap{max-width:1536px;margin:0 auto}
.map{position:relative;width:100%;aspect-ratio:1536/1024;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.map img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;width:5.6%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s;background:transparent;padding:0}
.hot:hover,.hot:focus-visible{border-color:var(--gold2);box-shadow:0 0 0 4px rgba(243,213,142,.35),0 0 18px rgba(243,213,142,.8);outline:none}
.hot.res{background:rgba(214,51,74,.72);border-color:#fff;box-shadow:0 0 14px rgba(214,51,74,.9)}
.hot.hold{background:rgba(227,162,26,.72);border-color:#fff;box-shadow:0 0 14px rgba(227,162,26,.9)}
.hot .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:clamp(7px,.95vw,14px);line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
.hot .t small{font-size:.62em;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.hot .t em{font-style:normal;font-size:.58em;font-weight:500;max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hot:not(.res):not(.hold) .t{display:none}
.hot.extra{width:3.5%;background:radial-gradient(circle at 50% 40%,#fff6df 0%,#f7d28b 62%,#e3a84f 100%);border:2px solid #fff3d6;box-shadow:0 0 0 3px rgba(255,243,214,.55),0 3px 10px rgba(0,0,0,.45)}
.hot.extra:not(.res):not(.hold) .t{display:flex;color:#2a1d05;text-shadow:none;font-size:clamp(7px,.9vw,13px)}
.hot.extra.res,.hot.extra.hold{border-color:#fff}
.hot.extra .t small{font-size:.5em}.hot.extra .t em{display:none}
.secbadge{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px;color:#fff;font-weight:700;font-family:Inter,sans-serif;letter-spacing:.2px;pointer-events:none;font-size:clamp(7px,.95vw,15px);border:1.5px solid rgba(255,255,255,.55);box-shadow:0 2px 6px rgba(0,0,0,.35);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.secbadge.full{color:#ffd1d6}
.legend{display:flex;gap:16px;align-items:center;color:#cdd3f0;font-size:13px;margin:12px auto 0;max-width:1536px;flex-wrap:wrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:2px solid #fff}
.tip{position:fixed;z-index:30;pointer-events:none;background:#fff;color:var(--ink);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;max-width:240px}
/* cards */
.card{background:var(--cream);border-radius:14px;padding:20px 22px;box-shadow:0 8px 30px rgba(0,0,0,.3);margin-bottom:18px}
.card h2{font-family:'Cormorant Garamond',serif;font-size:26px;margin:0 0 4px;color:var(--navy)}
.card p.hint{margin:0 0 14px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.full{grid-column:1/-1}
h3.sh{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--navy);margin:20px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
h3.sh:first-of-type{margin-top:4px;padding-top:0;border-top:0}
.calcbox{margin-top:12px;background:#f3ecd8;border:1px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink)}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button.b{border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;font-size:14px}
.b.pri{background:var(--navy);color:#fff}.b.pri:hover{background:#26326a}
.b.gold{background:var(--gold);color:var(--navy)}
.b.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.b.danger{background:#fff;border:1px solid var(--red);color:var(--red)}
.tbadge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.st-pend{background:#e7e0fa;color:#4b2f9e}.st-av{background:#dff3e7;color:#1f6e3f}.st-res{background:#fbdde2;color:#a11f34}.st-hold{background:#fcefd2;color:#8a5a00}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:1em}
/* summary */
.sec3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px}
.secbox{border-radius:12px;padding:14px 16px;background:#fff;border:1px solid var(--line)}
.secbox h3{margin:0 0 8px;font-size:15px}
.bar{height:10px;background:#eee7d4;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;cursor:pointer;border:0}
table.list{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
.list th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-weight:600;font-size:12px;letter-spacing:.3px}
.list td{padding:8px 10px;border-bottom:1px solid #f0ead9;vertical-align:top}
.list tr:hover td{background:#fbf4e2}
.list .act{color:var(--navy);font-weight:600;cursor:pointer;text-decoration:underline}
.list.reg{font-size:12px}
.list.reg th{font-size:10.5px;line-height:1.3;white-space:nowrap;padding:8px 8px}
.list.reg td{padding:7px 8px;white-space:nowrap}
.list.reg td:nth-child(3),.list.reg td:nth-child(20),.list.reg td:nth-child(21){white-space:normal}
.list.reg tr:nth-child(even){background:#faf5e6}
.list.reg tr.regtot{background:var(--navy)!important}
.list.reg tr.regtot td{color:#fff;font-weight:700;border-bottom:0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;margin:0}
.overflow{overflow-x:auto}
.seatbar{background:#f1ead9;border:1px solid #e0d3b4;border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:14px;line-height:1.6}
.cap{width:70px!important;margin:0!important;padding:5px 7px!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;z-index:40;border:1px solid var(--gold)}
.modal{position:fixed;inset:0;background:rgba(5,9,25,.6);display:none;align-items:center;justify-content:center;z-index:35;padding:16px}
.modal .card{max-width:420px;width:100%}
textarea.csv{font-family:ui-monospace,monospace;font-size:12px;min-height:180px}
@media (max-width:700px){header h1{font-size:21px}main{padding:12px}.kpi{min-width:96px}}
</style>
</head>

   <h2 id="fTitle">New Reservation</h2>
   <p class="hint" id="fHint">Pick a table on the floor plan or choose one below. Saving marks the table as reserved on the map straight away.</p>
   <form id="form" autocomplete="off">
    <h3 class="sh">Booking</h3>
    <div class="grid">
     <div><label>Booking ID<input id="f_id" disabled></label></div>
     <div><label>Table / Zone *<select id="f_table" required></select></label></div>
     <div><label>Status<select id="f_status"><option value="reserved">Reserved</option><option value="hold">On hold (pending payment)</option></select></label></div>
     <div><label>Date booked / requested<input id="f_date" type="date"></label></div>
     <div><label>Booking channel<input id="f_chan" list="dl_chan" placeholder="e.g. Expats, Regular, Walk-in"></label></div>
     <div><label>Promotion / Rate<input id="f_promo" list="dl_promo" placeholder="e.g. 35% Shock Deal"></label></div>
    </div>
    <datalist id="dl_chan"><option>Expats</option><option>Regular</option><option>Regular return</option><option>Walk-in</option><option>Front desk</option><option>Phone</option><option>LINE</option><option>Email</option><option>Sales / corporate</option><option>OTA</option></datalist>
    <datalist id="dl_promo"><option>Regular rate</option><option>35% Shock Deal</option><option>11.11 Special</option><option>Hotel Anniversary</option><option>Early Bird</option><option>Staff rate</option></datalist>

    <h3 class="sh">Guest / Group</h3>
    <div class="grid">
     <div><label>Guest / Group name *<input id="f_name" required placeholder="e.g. Mr. Robert Gull"></label></div>
     <div><label>Phone / contact<input id="f_phone" placeholder="08x-xxx-xxxx"></label></div>
     <div><label>Email<input id="f_email" type="email"></label></div>
     <div><label>Guest type<select id="f_type"><option>In-house guest</option><option>Outside / walk-in</option><option>Corporate / group</option><option>VIP / complimentary</option></select></label></div>
     <div><label>Room no.<input id="f_room" placeholder="if in-house"></label></div>
     <div><label>Booked by (staff)<input id="f_staff"></label></div>
    </div>

    <h3 class="sh">Party size &amp; pricing (THB net)</h3>
    <div class="grid">
     <div><label>Adults *<input id="f_adults" type="number" min="0" value="2" required></label></div>
     <div><label>Children 6–12<input id="f_kids612" type="number" min="0" value="0"></label></div>
     <div><label>Under 6<input id="f_under6" type="number" min="0" value="0"></label></div>
     <div><label>Adult rate<input id="f_adultRate" type="number" min="0" step="0.01"></label></div>
     <div><label>Child rate (6–12)<input id="f_childRate" type="number" min="0" step="0.01"></label></div>
     <div><label>Discount %<input id="f_discount" type="number" min="0" max="100" step="0.01" value="0"></label></div>
    </div>
    <div class="calcbox" id="calcBox"></div>

    <h3 class="sh">Payment</h3>
    <div class="grid">
     <div><label>Deposit paid (THB)<input id="f_deposit" type="number" min="0" step="0.01" value="0"></label></div>
     <div><label>Payment status<select id="f_paymentStatus"><option>Unpaid</option><option>Deposit Paid</option><option>Paid in Full</option><option>Complimentary</option><option>Charge to Room</option></select></label></div>
    </div>

    <h3 class="sh">Notes</h3>
    <div class="grid">
     <div class="full"><label>Dietary / special request<textarea id="f_dietary" placeholder="Allergies, high chair, birthday cake, near stage…"></textarea></label></div>
     <div class="full"><label>Remarks / follow-up<textarea id="f_remarks" placeholder="Internal notes, who to follow up with, transfers, etc."></textarea></label></div>
    </div>

    <div class="err" id="fErr"></div>
    <div class="btns">
     <button class="b pri" type="submit" id="fSave">Save reservation</button>
     <button class="b ghost" type="button" id="fNew">Clear form</button>
     <button class="b danger" type="button" id="fCancel" style="display:none">Cancel reservation (release table)</button>
     <button class="b ghost" type="button" id="fMap">Back to floor plan</button>
    </div>
   </form>
  </div>
 </section>

 <section class="view" id="v-summary">
  <div class="card">
   <h2>Reservation Summary</h2>
   <p class="hint" id="sumHint"></p>
   <div class="sec3" id="secs"></div>
   <div class="toolbar">
    <input id="q" placeholder="Search name, table, phone, room…" style="min-width:240px">
    <select id="qf"><option value="all">All tables</option><option value="res">Reserved</option><option value="hold">On hold</option><option value="av">Available</option><option value="none">Awaiting table</option></select>
    <button class="b ghost" id="csvBtn" type="button">Export CSV</button>
   </div>
   <div class="overflow"><table class="list" id="list"></table></div>
  </div>
 </section>

 <section class="view" id="v-register">
  <div class="card">
   <h2>Magic New Year 2027 | Guest Reservation Register</h2>
   <p class="hint" id="regHint">Event: 31 December 2026 · Springfield @ Sea Resort &amp; Spa — every reservation below, with pricing and balance calculated automatically from what you enter on the Reservation page.</p>
   <div class="toolbar">
    <input id="regQ" placeholder="Search booking ID, name, phone, table…" style="min-width:260px">
    <button class="b ghost" id="csvBtn2" type="button">Export CSV</button>

 </section>

 <section class="view" id="v-setup">
  <div class="card" id="adminLock" style="max-width:480px">
   <h2>Table Setup · Administrator only</h2>
   <p class="hint">Seat counts and payment options can only be changed by the administrator. Enter the admin PIN to continue.</p>
   <div class="toolbar"><input id="adminPin" type="password" inputmode="numeric" autocomplete="off" placeholder="Admin PIN" style="min-width:180px"><button class="b pri" type="button" id="adminGo">Unlock</button></div>
   <div id="adminErr" style="color:var(--red);font-weight:600;min-height:18px;margin-top:8px"></div>
  </div>
  <div class="card" id="adminBody" style="display:none">
   <div class="toolbar" style="justify-content:space-between"><span class="tbadge st-av">Administrator mode</span><button class="b ghost" type="button" id="adminLockBtn">Lock now</button></div>
   <h2>Table Setup</h2>
   <p class="hint">The total number of seats is locked, set any table to any number from <b>0 to 100</b> seats. The page only tracks how many seats are left out of the total. Use 0 for a table that is booked together with another table (for example C09 + C12). The extra table E01 is counted in the total.</p>
   <div class="toolbar"><span><b>Total seats (Sections A, B, C and E01) – locked at</b></span><input id="seatTotal" type="number" min="1" value="200" style="width:90px!important;padding:5px 7px"></div>
   <div class="seatbar" id="seatBar"></div>
   <div class="toolbar"><span>Set all seats in</span>
    <select id="bulkSec"><option value="ALL">All sections</option><option>A</option><option>B</option><option>C</option></select>
    <span>to</span><input id="bulkCap" type="number" min="0" max="100" class="cap" value="6">
    <button class="b gold" type="button" id="bulkBtn">Apply</button></div>
   <div class="sec3" id="capGrid"></div>
   <div class="btns"><button class="b pri" type="button" id="capSave">Save seat setup</button></div>
   <div id="capErr" style="color:var(--red);font-weight:600;min-height:18px"></div>
   <h2 style="margin-top:26px">Payment Status Options</h2>
   <p class="hint">These fill the Payment Status drop-down on the Reservation form. Add, edit or remove options, then save. Bookings that already use a removed option keep it.</p>
   <div id="payOptList"></div>
   <div class="btns"><button class="b ghost" type="button" id="payOptAdd">+ Add option</button><button class="b pri" type="button" id="payOptSave">Save payment options</button><button class="b ghost" type="button" id="payOptReset">Reset to default</button></div>
   <h2 style="margin-top:26px">Backup &amp; import</h2>
   <p class="hint">Copy all bookings and settings as text (a backup), or paste a backup here to restore it. Importing replaces everything.</p>
   <div class="btns"><button class="b ghost" type="button" id="expJson">Show backup text</button></div>
   <textarea id="impText" class="csv" placeholder="Paste backup text here…" style="min-height:90px"></textarea>
   <div class="btns"><button class="b pri" type="button" id="impGo">Import backup</button></div>
   <h2 style="margin-top:26px">Administrator PIN</h2>
   <p class="hint">Only people who know this PIN can open Table Setup. Choose 4 to 12 characters.</p>
   <div class="toolbar"><input id="newPin" type="password" autocomplete="new-password" placeholder="New PIN" style="min-width:180px"><button class="b pri" type="button" id="pinSave">Change PIN</button></div>
  </div>
 </section>
</main>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="login" style="z-index:60"><div class="card"><h2>Staff sign-in</h2><p class="hint">Gala Dinner reservations are private. Sign in with the staff email and password.</p>
 <label>Email<input id="lgEmail" type="email" autocomplete="username"></label><label>Password<input id="lgPw" type="password" autocomplete="current-password"></label>
 <div class="btns"><button class="b pri" type="button" id="lgGo">Sign in</button></div><div id="lgErr" style="color:var(--red);font-weight:600;min-height:18px;margin-top:8px"></div></div></div>
<div class="modal" id="modal"><div class="card"><h2 id="mT"></h2><p class="hint" id="mB"></p><div class="btns" id="mBtns"></div></div></div>
`);

$("#plan").src="data:image/jpeg;base64,"+$("#imgdata").textContent.trim();

/* hotspots */
const map=$("#map");
TABLES.forEach(t=>{
  const b=document.createElement("button");
  b.className="hot"+(t.sec==="E"?" extra":"");b.type="button";b.dataset.id=t.id;
  b.style.left=(t.x/W*100)+"%";b.style.top=(t.y/H*100)+"%";
  b.setAttribute("aria-label","Table "+t.id);
  b.innerHTML='<span class="t"></span>';
  b.addEventListener("click",()=>openTable(t.id));
  b.addEventListener("mousemove",e=>showTip(e,t.id));
  b.addEventListener("mouseleave",()=>$("#tip").style.display="none");
  map.appendChild(b);
});

/* live "available" badges painted over the (≈NN Guests) line on the original graphic */
/* All three badges share Section B's exact size (168 x 34), each centred under its own section */
const BADGE_W=168,BADGE_H=34,BADGE_Y0=823,BADGE_Y1=823+BADGE_H;
const SEC_CENTER_X={A:357,B:684,C:1010};
const SEC_BADGE={};
["A","B","C"].forEach(s=>{const cx=SEC_CENTER_X[s];SEC_BADGE[s]={x0:cx-BADGE_W/2,x1:cx+BADGE_W/2,y0:BADGE_Y0,y1:BADGE_Y1}});
const SEC_FILL={A:"#0c2470",B:"#6c0161",C:"#006432"};
["A","B","C"].forEach(s=>{
  const bb=SEC_BADGE[s],d=document.createElement("div");
  d.className="secbadge";d.id="secbadge-"+s;
  d.style.left=(bb.x0/W*100)+"%";d.style.top=(bb.y0/H*100)+"%";
  d.style.width=((bb.x1-bb.x0)/W*100)+"%";d.style.height=((bb.y1-bb.y0)/H*100)+"%";
  d.style.background=SEC_FILL[s];
  map.appendChild(d);
});
function updateSecBadges(st){
  ["A","B","C"].forEach(s=>{
    const x=st.sec[s],avail=Math.max(0,x.seats-x.guests),el=document.getElementById("secbadge-"+s);
    if(!el)return;
    el.textContent="("+avail+" available)";
    el.classList.toggle("full",avail===0&&x.seats>0);
  });
}

function showTip(e,id){
  const r=S.res[id],tip=$("#tip");
  tip.innerHTML=r?`<b>${id}</b> · ${r.status==="hold"?"On hold":"Reserved"}<br>${esc(r.name)}<br>${pax(r)} pax / ${S.cap[id]} seats · ${esc(r.paymentStatus)}`:`<b>${id}</b> · Available<br>${S.cap[id]} seats – click to reserve`;
  tip.style.display="block";
  const x=Math.min(e.clientX+14,innerWidth-250);tip.style.left=x+"px";tip.style.top=(e.clientY+14)+"px";
}
const pax=r=>(+r.adults||0)+(+r.kids612||0)+(+r.under6||0);
/* "None table": a booking saved before a table is confirmed. Stored in S.res under key NT<bookingId>. */
const NONE="NONE",isPend=k=>/^NT\d+$/.test(k||"");
const pending=()=>Object.keys(S.res).filter(isPend).map(k=>({id:k,sec:"N"})).sort((a,b)=>(S.res[a.id].id||0)-(S.res[b.id].id||0));
const allBooked=()=>pending().concat(TABLES.filter(t=>S.res[t.id]));
let editKey=null;
function money(r){
  const adults=+r.adults||0,k=+r.kids612||0;
  const gross=adults*(+r.adultRate||0)+k*(+r.childRate||0);
  const disc=Math.min(100,Math.max(0,+r.discount||0));
  const net=gross*(1-disc/100);
  const balance=net-(+r.deposit||0);
  return{gross,net,balance};
}
function badgeClass(s){s=(s||"").toLowerCase();if(s.includes("full")||s.includes("comp"))return "st-res";if(s.includes("deposit")||s.includes("charge"))return "st-hold";return "st-av"}

/* ---------- render ---------- */
function stats(){
  const o={tot:TABLES.length,res:0,hold:0,av:0,seats:0,guests:0,pend:0,pendGuests:0,sec:{}};
  ["A","B","C","E"].forEach(s=>o.sec[s]={tot:0,res:0,hold:0,av:0,seats:0,guests:0});
  TABLES.forEach(t=>{const r=S.res[t.id],s=o.sec[t.sec];s.tot++;s.seats+=+S.cap[t.id];
    if(!r){o.av++;s.av++}else{r.status==="hold"?(o.hold++,s.hold++):(o.res++,s.res++);o.guests+=pax(r);s.guests+=pax(r)}});
  o.seats+=S.seatTotal;
  pending().forEach(t=>{o.pend++;o.pendGuests+=pax(S.res[t.id])});
  return o;
}
function render(){
  const st=stats();
  updateSecBadges(st);
  $("#kpis").innerHTML=`
   <div class="kpi"><b>${st.tot}</b><span>Total tables</span></div>
   <div class="kpi r"><b>${st.res}</b><span>Reserved</span></div>
   <div class="kpi" style="--x:1"><b style="color:#ffd27a">${st.hold}</b><span>On hold</span></div>
   <div class="kpi a"><b>${st.av}</b><span>Available</span></div>
   <div class="kpi"><b style="color:#c9b6ff">${st.pend}</b><span>Awaiting table${st.pend?" · "+st.pendGuests+" guests":""}</span></div>
   <div class="kpi g"><b>${st.guests+st.pendGuests} / ${st.seats}</b><span>Guests booked / seats</span></div>
   <div class="kpi g"><b style="color:${st.seats-st.guests-st.pendGuests<0?"#ff8b9b":"#7fe0a6"}">${st.seats-st.guests-st.pendGuests}</b><span>Seats left (all guests)</span></div>`;
  $$(".hot").forEach(b=>{const id=b.dataset.id,r=S.res[id];
    b.classList.toggle("res",!!r&&r.status!=="hold");b.classList.toggle("hold",!!r&&r.status==="hold");
    b.querySelector(".t").innerHTML=r?`${id}<small>${r.status==="hold"?"Hold":"Reserved"}</small><em>${esc(r.name)}</em>`:(b.classList.contains("extra")?id:"");});
  // table select
  const sel=$("#f_table"),cur=sel.value;
  sel.innerHTML=`<option value="${NONE}">None table · awaiting table confirmation</option>`+
    pending().map(t=>{const r=S.res[t.id];return `<option value="${t.id}">None table · PENDING – ${esc(r.name)} (#${r.id})</option>`}).join("")+
    TABLES.map(t=>{const r=S.res[t.id];return `<option value="${t.id}">${t.id} · ${S.cap[t.id]} seats · ${r?(r.status==="hold"?"ON HOLD – ":"RESERVED – ")+esc(r.name):"Available"}</option>`}).join("");
  if(cur&&[...sel.options].some(o=>o.value===cur))sel.value=cur;
  renderSummary(st);renderRegister();renderSetup();
}
function renderSummary(st){
  st=st||stats();
  $("#sumHint").textContent=`${st.res} reserved, ${st.hold} on hold and ${st.av} available out of ${st.tot} tables · ${st.guests+st.pendGuests} guests booked of ${st.seats} seats (${st.guests} at tables${st.pend?`, ${st.pendGuests} awaiting a table`:""}) · ${st.seats-st.guests-st.pendGuests} seats left`+(S.updated?` · last saved ${new Date(S.updated).toLocaleString("en-GB")}`:"");
  $("#secs").innerHTML=["A","B","C","E"].map(s=>{const x=st.sec[s],p=x.tot?Math.round((x.res+x.hold)/x.tot*100):0;
    return `<div class="secbox" style="border-top:4px solid ${SEC_COL[s]}"><h3>${SEC_NAME[s]}</h3>
     <div style="font-size:13px">${x.res} reserved · ${x.hold} hold · <b style="color:var(--green)">${x.av} available</b> · ${x.guests}/${x.seats} guests</div>
     <div class="bar"><i style="width:${p}%;background:${SEC_COL[s]}"></i></div>
     <div class="chips">${TABLES.filter(t=>t.sec===s).map(t=>{const r=S.res[t.id];const c=!r?"st-av":r.status==="hold"?"st-hold":"st-res";return `<button class="chip ${c}" data-open="${t.id}" title="${r?esc(r.name):"Available"}">${t.id}</button>`}).join("")}</div></div>`}).join("");
  const q=$("#q").value.trim().toLowerCase(),f=$("#qf").value;
  const match=(t,r)=>{if(!q)return true;return ((isPend(t.id)?"none table pending":t.id)+" "+(r?[r.name,r.phone,r.email,r.room,r.dietary,r.remarks,r.staff].join(" "):"")).toLowerCase().includes(q)};
  const rows=[];
  if(f==="all"||f==="none")pending().forEach(t=>{if(match(t,S.res[t.id]))rows.push(t)});
  if(f!=="none")TABLES.forEach(t=>{const r=S.res[t.id];
    if(f==="res"&&!(r&&r.status!=="hold"))return;if(f==="hold"&&!(r&&r.status==="hold"))return;if(f==="av"&&r)return;
    if(match(t,r))rows.push(t)});
  $("#list").innerHTML=`<tr><th>Table</th><th>Status</th><th>Guest</th><th>Contact</th><th>Room / type</th><th>Pax</th><th>Seats</th><th>Payment</th><th>Notes</th><th></th></tr>`+
   rows.map(t=>{const r=S.res[t.id],pend=isPend(t.id);
    if(!r)return `<tr><td><b>${t.id}</b></td><td><span class="tbadge st-av">Available</span></td><td colspan="4" style="color:var(--muted)">—</td><td>${S.cap[t.id]}</td><td></td><td></td><td><span class="act" data-open="${t.id}">Reserve</span></td></tr>`;
    const over=!pend&&pax(r)>+S.cap[t.id],m=money(r);
    return `<tr><td><b>${pend?"None table":t.id}</b></td><td><span class="tbadge ${pend?"st-pend":r.status==="hold"?"st-hold":"st-res"}">${pend?"Awaiting table":r.status==="hold"?"On hold":"Reserved"}</span></td>
     <td><b>${esc(r.name)}</b><br><span style="color:var(--muted);font-size:11px">#${r.id||""} · by ${esc(r.staff||"—")} · ${esc(r.chan||"")}${r.date?" · "+r.date:""}</span></td>
     <td>${esc(r.phone)}${r.email?"<br>"+esc(r.email):""}</td><td>${esc(r.room||"")}${r.room?"<br>":""}<span style="font-size:11px;color:var(--muted)">${esc(r.type)}</span></td>
     <td${over?' style="color:var(--red);font-weight:700" title="More guests than seats"':""}>${+r.adults||0}A${+r.kids612?" + "+r.kids612+"C":""}${+r.under6?" + "+r.under6+"U6":""}</td><td>${pend?"—":S.cap[t.id]}</td>
     <td><span class="tbadge ${badgeClass(r.paymentStatus)}">${esc(r.paymentStatus)}</span>${m.balance>0.004?"<br><span style='color:var(--red)'>Due ฿"+fmt(m.balance)+"</span>":""}</td><td style="max-width:220px">${esc(r.dietary)}</td><td><span class="act" data-open="${t.id}">${pend?"Assign table":"Edit"}</span></td></tr>`}).join("");
}
function renderRegister(){
  const q=($("#regQ")&&$("#regQ").value||"").trim().toLowerCase();
  let rows=allBooked();
  rows.sort((a,b)=>(S.res[a.id].id||0)-(S.res[b.id].id||0));
  if(q)rows=rows.filter(t=>{const r=S.res[t.id];return ((isPend(t.id)?"none table pending":t.id)+" "+r.id+" "+[r.name,r.phone,r.email,r.room,r.dietary,r.remarks].join(" ")).toLowerCase().includes(q)});
  let g=0,n=0,d=0,bal=0;
  const trs=rows.map(t=>{
    const r=S.res[t.id],m=money(r);g+=m.gross;n+=m.net;d+=(+r.deposit||0);bal+=m.balance;
    return `<tr>
     <td>${r.id||""}</td>
     <td>${esc(r.date||"")}</td>
     <td><b>${esc(r.name)}</b></td>
     <td>${esc(r.phone)}</td>
     <td>${esc(r.email)}</td>
     <td>${esc(r.chan)}</td>
     <td>${esc(r.promo)}</td>
     <td style="text-align:center">${+r.adults||0}</td>
     <td style="text-align:center">${+r.kids612||0}</td>
     <td style="text-align:center">${+r.under6||0}</td>
     <td style="text-align:right">${r.adultRate?fmt(r.adultRate):""}</td>
     <td style="text-align:right">${r.childRate?fmt(r.childRate):""}</td>
     <td style="text-align:right">${fmt(m.gross)}</td>
     <td style="text-align:center">${r.discount?(+r.discount)+"%":""}</td>
     <td style="text-align:right">${fmt(m.net)}</td>
     <td style="text-align:right">${fmt(r.deposit)}</td>
     <td style="text-align:right${m.balance>0.004?';color:var(--red);font-weight:700':''}">${fmt(m.balance)}</td>
     <td><span class="tbadge ${badgeClass(r.paymentStatus)}">${esc(r.paymentStatus)}</span></td>
     <td>${isPend(t.id)?'<span class="tbadge st-pend">None table</span>':"<b>"+t.id+"</b>"}${r.status==="hold"?' <span class="tbadge st-hold">Hold</span>':''}</td>
     <td style="max-width:160px">${esc(r.dietary)}</td>
     <td style="max-width:160px">${esc(r.remarks)}</td>
     <td>${esc(r.type||"")}</td>
     <td>${esc(r.room||"")}</td>
     <td><span class="act" data-open="${t.id}">${isPend(t.id)?"Assign table":"Edit"}</span></td>
    </tr>`;
  }).join("");
  const head=`<tr><th>Booking<br>ID</th><th>Date<br>Booked</th><th>Guest / Group Name</th><th>Phone / Contact</th><th>Email</th><th>Booking<br>Channel</th><th>Promotion / Rate</th>

async function commit(msg){
  S.updated=new Date().toISOString();

  if(!FB){try{localStorage.setItem("gala2027",JSON.stringify(S))}catch(e){}}
  if(FB)return fbCommit(msg);

  catch(e){const c=e&&(e.code||e.name||e.message)||"";

}

const FS=FB?`https://firestore.googleapis.com/v1/projects/${encodeURIComponent(FB.projectId)}/databases/(default)/documents`:"";
const COL_B="gala2027_bookings",COL_C="gala2027_config";
let fbAuth=null,fbRaw={},fbCfgRaw="",fbPollT=null;

function loadAuth(){try{return JSON.parse(localStorage.getItem("galaAuth")||"null")}catch(e){return null}}
function saveAuth(a){fbAuth=a;try{a?localStorage.setItem("galaAuth",JSON.stringify(a)):localStorage.removeItem("galaAuth")}catch(e){}}
async function fbSignIn(email,pw){
  const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(FB.apiKey),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password:pw,returnSecureToken:true})});
  const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||"sign-in failed");
  saveAuth({email:j.email,refresh:j.refreshToken,id:j.idToken,exp:Date.now()+(Math.max(60,+j.expiresIn)-60)*1000});
}
async function fbToken(){
  if(!fbAuth)throw Object.assign(new Error("signed-out"),{status:401});
  if(Date.now()<fbAuth.exp)return fbAuth.id;
  const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(FB.apiKey),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(fbAuth.refresh)});
  const j=await r.json();if(!r.ok){saveAuth(null);throw Object.assign(new Error("signed-out"),{status:401})}
  saveAuth({email:fbAuth.email,refresh:j.refresh_token,id:j.id_token,exp:Date.now()+(Math.max(60,+j.expires_in)-60)*1000});return fbAuth.id;
}
async function fbFetch(path,opt){
  const t=await fbToken();opt=opt||{};opt.headers=Object.assign({Authorization:"Bearer "+t,"Content-Type":"application/json"},opt.headers||{});
  const r=await fetch(FS+path,opt);
  if(r.status===401){saveAuth(null);throw Object.assign(new Error("signed-out"),{status:401})}
  if(r.status===403)throw Object.assign(new Error("This account is not allowed to use the shared database."),{status:403});
  return r;
}
async function fbList(col){const out=[];let tok="";do{const r=await fbFetch("/"+col+"?pageSize=300"+(tok?"&pageToken="+encodeURIComponent(tok):""));if(!r.ok)throw new Error("read "+r.status);const j=await r.json();(j.documents||[]).forEach(d=>out.push(d));tok=j.nextPageToken||""}while(tok);return out}
async function fbPull(){
  const [bk,cf]=await Promise.all([fbList(COL_B),fbList(COL_C)]);
  const raw={};bk.forEach(d=>{raw[d.name.split("/").pop()]=d.fields&&d.fields.json&&d.fields.json.stringValue||"null"});
  let cfgRaw="",counter=null;cf.forEach(d=>{const k=d.name.split("/").pop();if(k==="main")cfgRaw=d.fields.json.stringValue;if(k==="counter"&&d.fields&&d.fields.last)counter=+d.fields.last.integerValue});
  return{raw,cfgRaw,counter};
}
const fbSig=x=>JSON.stringify([Object.keys(x.raw).sort().map(k=>[k,x.raw[k]]),x.cfgRaw,x.counter]);
let fbLastSig="";
function fbApply(x){
  const res={};Object.keys(x.raw).forEach(k=>{try{const o=JSON.parse(x.raw[k]);if(o)res[k]=o}catch(e){}});
  S.res=res;
  if(x.cfgRaw){try{const c=JSON.parse(x.cfgRaw);["cap","payOptions","seatTotal","adminHash","lastRate"].forEach(k=>{if(c[k]!=null)S[k]=c[k]})}catch(e){}}
  if(x.counter!=null)S.nextId=x.counter+1;
  TABLES.forEach(t=>{if(S.cap[t.id]==null||S.cap[t.id]==="")S.cap[t.id]=DEFAULT_CAP[t.id]});
  fbRaw=Object.assign({},x.raw);fbCfgRaw=x.cfgRaw;fbLastSig=fbSig(x);S.updated=new Date().toISOString();
}
async function fbAllocId(){
  const name=`projects/${FB.projectId}/databases/(default)/documents/${COL_C}/counter`;
  const r=await fbFetch(":commit",{method:"POST",body:JSON.stringify({writes:[{update:{name},updateMask:{fieldPaths:[]},updateTransforms:[{fieldPath:"last",increment:{integerValue:"1"}}]}]})});
  const j=await r.json();if(!r.ok)throw new Error("Could not get a booking number ("+r.status+")");
  return +j.writeResults[0].transformResults[0].integerValue;
}
/* write only what changed; a NEW table booking may not overwrite a booking someone else just made */
async function fbPush(force){
  const keys=Object.keys(S.res);
  for(const k of Object.keys(fbRaw)){if(!(k in S.res)){const r=await fbFetch("/"+COL_B+"/"+encodeURIComponent(k),{method:"DELETE"});if(!r.ok&&r.status!==404)throw new Error("delete "+r.status);delete fbRaw[k]}}
  for(const k of keys){
    const raw=JSON.stringify(S.res[k]);if(!force&&fbRaw[k]===raw)continue;
    const isNew=!force&&!(k in fbRaw);
    const r=await fbFetch("/"+COL_B+"/"+encodeURIComponent(k)+(isNew?"?currentDocument.exists=false":""),{method:"PATCH",body:JSON.stringify({fields:{json:{stringValue:raw}}})});
    if(!r.ok){if(isNew&&(r.status===409||r.status===400))throw Object.assign(new Error("conflict"),{conflict:k});throw new Error("save "+r.status)}
    fbRaw[k]=raw;
  }
  const cr=cfgOf();
  if(force||cr!==fbCfgRaw){const r=await fbFetch("/"+COL_C+"/main",{method:"PATCH",body:JSON.stringify({fields:{json:{stringValue:cr}}})});if(!r.ok)throw new Error("save "+r.status);fbCfgRaw=cr}
  if(force){const r=await fbFetch("/"+COL_C+"/counter",{method:"PATCH",body:JSON.stringify({fields:{last:{integerValue:String(Math.max(0,(+S.nextId||1)-1))}}})});if(!r.ok)throw new Error("save "+r.status)}
}
async function fbCommit(msg,force){
  if(!fbAuth){showLogin();return}
  if(saving){toast("Still saving the previous change…");return}
  saving=true;setSave("Saving…");
  try{await fbPush(force);toast(msg+" ✓ saved for everyone");fbSaved();fbLastSig="~"}
  catch(e){
    if(e.conflict){toast(`Table ${e.conflict} was just reserved by someone else – your change was not saved`);saving=false;await fbSync(true);return}
    if(e.status===401){showLogin();setSave("Signed out")}
    else if(e.status===403){toast(e.message);setSave("Not allowed")}
    else{toast("Could not save: "+(e.message||e));setSave("Save failed")}
  }
  saving=false;
}
const fbSaved=()=>setSave("Shared database · "+(fbAuth?fbAuth.email:""));
async function fbSync(force){
  try{const x=await fbPull(),sg=fbSig(x);
    if(force||sg!==fbLastSig){const first=!fbLastSig;fbApply(x);render();if(first)renderPayOpts();
      if(!x.cfgRaw&&!Object.keys(x.raw).length)setSave("Shared database is empty – an administrator can import the starting bookings (Table Setup → Backup & import)");else fbSaved()}
  }catch(e){
    if(e.status===401){showLogin();setSave("Signed out")}
    else if(e.status===403){setSave("Not allowed");toast(e.message)}
    else setSave("Cannot reach the shared database – retrying…");
  }
}
function showLogin(){clearInterval(fbPollT);$("#login").style.display="flex";$("#lgErr").textContent="";setTimeout(()=>($("#lgEmail").value?$("#lgPw"):$("#lgEmail")).focus(),50)}
async function fbStart(){
  $("#login").style.display="none";$("#signout").style.display="";
  setSave("Connecting to the shared database…");
  await fbSync(true);
  clearInterval(fbPollT);fbPollT=setInterval(()=>{if(!saving&&!document.hidden)fbSync(false)},10000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&fbAuth&&!saving)fbSync(false)});
}
async function tryLogin(){
  const em=$("#lgEmail").value.trim(),pw=$("#lgPw").value;if(!em||!pw){$("#lgErr").textContent="Enter the staff email and password.";return}
  $("#lgGo").disabled=true;$("#lgErr").textContent="";
  try{await fbSignIn(em,pw);$("#lgPw").value="";await fbStart()}
  catch(e){const m=String(e.message||e);$("#lgErr").textContent=/INVALID|EMAIL_NOT_FOUND|PASSWORD/.test(m)?"Wrong email or password.":/TOO_MANY/.test(m)?"Too many attempts – wait a few minutes.":"Could not sign in: "+m}
  $("#lgGo").disabled=false;
}
if(FB){
  $("#saveState").insertAdjacentHTML("afterend",' <a href="#" id="signout" style="display:none;color:#f3d58e;font-size:12px;margin-left:8px">Sign out</a>');
  $("#lgGo").onclick=tryLogin;$("#lgPw").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin()});
  $("#signout").onclick=e=>{e.preventDefault();saveAuth(null);clearInterval(fbPollT);S.res={};render();$("#signout").style.display="none";setSave("Signed out");showLogin()};
}
/* backup / import (works in both modes) */
$("#expJson").onclick=()=>{if(!guard())return;const data=JSON.stringify({res:S.res,cap:S.cap,payOptions:S.payOptions,seatTotal:S.seatTotal,adminHash:S.adminHash,lastRate:S.lastRate,nextId:S.nextId},null,1);
  modal("Backup text",`<textarea class="csv" readonly>${esc(data)}</textarea>`,[["Copy to clipboard","gold",async()=>{try{await navigator.clipboard.writeText(data);toast("Copied")}catch(e){toast("Select the text and copy it manually")}}],["Close","ghost"]])};
$("#impGo").onclick=()=>{if(!guard())return;let o;
  try{o=JSON.parse($("#impText").value)}catch(e){toast("That is not valid backup text");return}
  if(!o||typeof o.res!=="object"){toast("Backup text has no bookings section");return}
  confirmBox("Replace everything?",`This replaces all current bookings and settings with the backup (${Object.keys(o.res).length} bookings).`,"Yes, import",async()=>{
    S.res=o.res;if(o.cap)S.cap=Object.assign({},S.cap,o.cap);if(Array.isArray(o.payOptions)&&o.payOptions.length)S.payOptions=o.payOptions;
    if(+o.seatTotal>0)S.seatTotal=+o.seatTotal;if(o.adminHash)S.adminHash=o.adminHash;if(o.lastRate)S.lastRate=o.lastRate;
    S.nextId=Math.max(+o.nextId||1,...Object.values(S.res).map(r=>(+r.id||0)+1));
    $("#impText").value="";
    if(FB)await fbCommit("Backup imported",true);else await commit("Backup imported");render();renderPayOpts();
  })};

/* ---------- boot ---------- */
render();renderPayOpts();go(location.hash.slice(1)||"floor");
$("#f_table").value=TABLES[0].id;fillForm(TABLES[0].id);
setSave("Connecting…");
if(FB){fbAuth=loadAuth();if(fbAuth)fbStart();else{setSave("Signed out");showLogin()}}
else if(window.claude&&window.claude.use){
  window.claude.use("artifact").then(a=>{artifactApi=a;setSave(a?"Shared – changes save for all staff":"Preview – changes saved on this device only")}).catch(()=>setSave("Preview – changes saved on this device only"));
  window.claude.use("downloads").then(d=>{dlApi=d}).catch(()=>{});
}else setSave("Offline – changes saved on this device only");
})();

</script>
